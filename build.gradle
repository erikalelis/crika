plugins {
    id 'com.android.application'
}

android {
    namespace 'app.crika'
    compileSdk 34

    defaultConfig {
        applicationId 'app.crika'
        minSdk 24
        targetSdk 34
        // GitHub numera cada compilación (GITHUB_RUN_NUMBER): así cada versión nueva es más alta que la anterior
        def runNumber = Math.max((System.getenv('GITHUB_RUN_NUMBER') ?: '3').toInteger(), 3)
        versionCode runNumber
        versionName "2.${runNumber}"
    }

    signingConfigs {
        debug {
            storeFile file('crika.keystore')
            storePassword 'crikapass'
            keyAlias 'crika'
            keyPassword 'crikapass'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
