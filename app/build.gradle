plugins {
    id 'com.android.application'
}

android {
    namespace 'app.crika'
    compileSdk 34

    defaultConfig {
        applicationId 'app.crika'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        debug {
            storeFile file('crika.keystore')
            storePassword 'crikapass'
            keyAlias 'crika'
            keyPassword 'crikapass'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
