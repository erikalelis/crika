name: Crear la app de Crika (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar la app
        run: gradle --no-daemon assembleDebug

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/debug/app-debug.apk Crika.apk

      - name: Guardar como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Crika-apk
          path: Crika.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crika-${{ github.run_number }}
          name: Crika (versión ${{ github.run_number }})
          body: "Descargá Crika.apk desde el celular e instalalo."
          files: Crika.apk
